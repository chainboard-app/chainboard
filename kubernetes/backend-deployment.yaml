apiVersion: apps/v1
kind: Deployment
metadata:
  name: chainboard-backend
  labels:
    app: chainboard-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: chainboard-backend
  template:
    metadata:
      labels:
        app: chainboard-backend
    spec:
      containers:
      - name: backend
        image: chainboard/backend:latest
        ports:
        - containerPort: 4000
        env:
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: chainboard-secrets
              key: database-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: chainboard-secrets
              key: jwt-secret
        - name: STELLAR_NETWORK
          value: "mainnet"
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: chainboard-secrets
              key: redis-url
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/db
            port: 4000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: chainboard-backend-service
spec:
  selector:
    app: chainboard-backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 4000
  type: ClusterIP
